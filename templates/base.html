<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OctoFormations{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="nav-brand">
            <img src="{{ url_for('static', filename='imagenes/logo.png') }}" alt="Logo" class="nav-logo">
            <span class="nav-title">Formations</span>
        </a>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script>
        document.querySelectorAll('.barra-fill[data-width]').forEach(el => {
            el.style.width = el.dataset.width + '%';
        });
    </script>
</body>
</html>
